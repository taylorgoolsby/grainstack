AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Grainstack tenant infrastructure: DynamoDB tables (dev, prod), IAM policies/roles/users,
  the versioned code bucket, and a Secrets Manager secret holding the generated access keys.
  The Lambda Web Functions are created by the provisioner, not by this stack, because
  `grainstack deploy` creates revisions outside CloudFormation.

Parameters:
  TenantSlug:
    Type: String
    AllowedPattern: "^[a-z0-9]{4,12}$"
    ConstraintDescription: 4-12 characters, a-z and 0-9 only
  DevFunctionName:
    Type: String
    Description: Name the provisioner gives the dev Web Function (used only to scope IAM policies)
  ProdFunctionName:
    Type: String
    Description: Name the provisioner gives the prod Web Function (used only to scope IAM policies)

Resources:
  # ---------------------------------------------------------------- DynamoDB
  DevTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "gs-${TenantSlug}-dev-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  ProdTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "gs-${TenantSlug}-prod-table"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ---------------------------------------------------------------- S3 code bucket
  # No lifecycle rules on purpose: deleting an object version that a revision uses
  # permanently fails that revision.
  CodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "gs-${TenantSlug}-deploy-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaWebFunctionCodeAccess
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${CodeBucket.Arn}/*"
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${DevFunctionName}/revision/*"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${ProdFunctionName}/revision/*"

  # ---------------------------------------------------------------- IAM policies
  DevDynamoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "gs-${TenantSlug}-dev-dynamodb"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt DevTable.Arn
              - !Sub "${DevTable.Arn}/index/*"

  ProdDynamoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "gs-${TenantSlug}-prod-dynamodb"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt ProdTable.Arn
              - !Sub "${ProdTable.Arn}/index/*"

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "gs-${TenantSlug}-deploy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WebFunctionRevisions
            Effect: Allow
            # GetWebFunctionEndpoint is inferred from the CLI command name; the rest are in the docs.
            Action:
              - lambda:CreateWebFunctionRevision
              - lambda:GetWebFunction
              - lambda:GetWebFunctionRevision
              - lambda:GetWebFunctionEndpoint
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${DevFunctionName}"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${DevFunctionName}/revision/*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${DevFunctionName}/endpoint/*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${ProdFunctionName}"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${ProdFunctionName}/revision/*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${ProdFunctionName}/endpoint/*"
          - Sid: PassExecutionRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt DevLambdaRole.Arn
              - !GetAtt ProdLambdaRole.Arn
          - Sid: CodeBucket
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${CodeBucket.Arn}/*"

  # ---------------------------------------------------------------- IAM roles (Lambda execution)
  DevLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gs-${TenantSlug}-dev-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref DevDynamoPolicy

  ProdLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gs-${TenantSlug}-prod-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ProdDynamoPolicy

  # ---------------------------------------------------------------- IAM users + keys
  # The local-dev user gets the DEV policy only, so local code can never touch prod data.
  LocalUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "gs-${TenantSlug}-local-dev"
      ManagedPolicyArns:
        - !Ref DevDynamoPolicy

  DeployUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "gs-${TenantSlug}-deployer"
      ManagedPolicyArns:
        - !Ref DeployPolicy

  LocalAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref LocalUser

  DeployAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref DeployUser

  # ---------------------------------------------------------------- Secret handoff
  # The secret access keys are only available inside the template (Fn::GetAtt). Stack
  # outputs are readable by anyone who can describe the stack, so the keys go into
  # Secrets Manager instead. The provisioner reads this secret to write .env.local/.env.deploy.
  CredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "grainstack/tenants/${TenantSlug}/credentials"
      Description: !Sub "Generated access keys for Grainstack tenant ${TenantSlug}"
      SecretString: !Sub '{"localAccessKeyId":"${LocalAccessKey}","localSecretAccessKey":"${LocalAccessKey.SecretAccessKey}","deployAccessKeyId":"${DeployAccessKey}","deploySecretAccessKey":"${DeployAccessKey.SecretAccessKey}"}'

Outputs:
  Bucket:
    Value: !Ref CodeBucket
  SecretArn:
    Value: !Ref CredentialsSecret
  DevTable:
    Value: !Ref DevTable
  ProdTable:
    Value: !Ref ProdTable
  DevRoleArn:
    Value: !GetAtt DevLambdaRole.Arn
  ProdRoleArn:
    Value: !GetAtt ProdLambdaRole.Arn
  DevFunctionName:
    Value: !Ref DevFunctionName
  ProdFunctionName:
    Value: !Ref ProdFunctionName
